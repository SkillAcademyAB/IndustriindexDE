[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industriindex-de"
version = "0.1.0"
description = "A Python project for IndustriindexDE"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Björn Bergdahl", email = "bjorn.bergdahl@skill.se"},
    {name = "Tomas Kindahl", email = "tomas.kindahl@skill.se"}
]
dependencies = [
    "pyscbwrapper>=0.1.2",
    "duckdb>=1.4.1",
    "pandas>=2.3.3",
    "fastapi[standard]>=0.121.0",
    "tinydb>=4.8.0"
]

[project.scripts]
industriindex-de = "src.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.0",
    "flake8>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.black]
line-length = 88
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
